name: CI — Lint & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: Lint ───────────────────────────────────────────
  lint-backend:
    name: 🐍 Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: ruff check back-end/app

  # ─── Backend: Docker Build ────────────────────────────────────
  build-backend:
    name: 🐳 Backend Docker Build
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Frontend: Lint & Build ───────────────────────────────────
  build-frontend:
    name: ⚛️ Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front-end

      - name: Lint
        run: npm run lint
        working-directory: front-end

      - name: Build
        run: npm run build
        working-directory: front-end
        env:
          # Dùng placeholder để CI chỉ kiểm tra build không lỗi
          VITE_API_BASE_URL: https://api.placeholder.com/api/v1
          VITE_GOOGLE_CLIENT_ID: placeholder-client-id
          VITE_ENV: production
