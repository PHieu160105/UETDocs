server {
    listen 80;
    server_name uetdocs.huyhieupham.id.vn www.uetdocs.huyhieupham.id.vn api.uetdocs.huyhieupham.id.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

#frontend
server {
    listen 443 ssl;
    server_name uetdocs.huyhieupham.id.vn www.uetdocs.huyhieupham.id.vn;

    ssl_certificate     /etc/letsencrypt/live/uetdocs.huyhieupham.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uetdocs.huyhieupham.id.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

#backend
server {
    listen 443 ssl;
    server_name api.uetdocs.huyhieupham.id.vn;

    ssl_certificate     /etc/letsencrypt/live/api.uetdocs.huyhieupham.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uetdocs.huyhieupham.id.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 50M;
    }
}